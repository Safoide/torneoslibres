<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- Favicon: el escudo verde con la copa (sin el texto). El .ico (16/32/48) es para navegadores viejos y Google -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- Valores de la portada (los ve quien todavía no cargó el JS). Cada página los cambia con useTitulo -->
    <meta
      name="description"
      content="Encontrá torneos de fútbol 5, 7, 8 y 11 en Buenos Aires e inscribí a tu equipo. Organizadores: publicá tus torneos y manejá inscripciones, fixture, resultados y pagos."
    />
    <script>
      /* Aplica el tema guardado antes de pintar, para que no parpadee */
      try {
        var a = JSON.parse(localStorage.getItem('ajustes') || '{}');
        var d = document.documentElement;
        d.dataset.theme = a.tema === 'claro' || (a.tema === 'auto' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        if (a.texto === 'grande') d.dataset.texto = 'grande';
      } catch (e) {}
    </script>
    <title>Torneos de fútbol 5, 7, 8 y 11 en Buenos Aires - Torneos Libres</title>
  </head>
  <body id="root"></body>
</html>
