<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Encontra torneos de futbol 5, 7, 8 y 11 en Buenos Aires"
    />
    <script>
      /* Aplica el tema guardado antes de pintar, para que no parpadee */
      try {
        var a = JSON.parse(localStorage.getItem('ajustes') || '{}');
        var d = document.documentElement;
        d.dataset.theme = a.tema === 'claro' || (a.tema === 'auto' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        if (a.texto === 'grande') d.dataset.texto = 'grande';
      } catch (e) {}
    </script>
    <title>Torneos Libres - Torneos de F5, F7, F8 y F11 en Buenos Aires</title>
  </head>
  <body id="root"></body>
</html>
